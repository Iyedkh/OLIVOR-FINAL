<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer glowing background circle -->
  <circle cx="50" cy="50" r="45" fill="#3e5219" fill-opacity="0.05" />
  
  <!-- Droplet of Olive Oil (Gold) -->
  <path d="M50 20 C62 38 68 48 68 62 C68 74 58 82 50 82 C42 82 32 74 32 62 C32 48 38 38 50 20 Z" fill="url(#goldGradient)" />
  
  <!-- Olive Branch/Leaf (Olive Green) -->
  <path d="M50 35 C52 45 42 55 42 62 C42 69 48 72 50 72 C52 72 58 69 58 62 C58 55 48 45 50 35 Z" fill="url(#greenGradient)" />
  
  <!-- Inner Highlight -->
  <path d="M48 28 C52 38 55 43 55 52 C55 57 52 60 48 60 C44 60 41 57 41 52 C41 43 44 38 48 28 Z" fill="#ffffff" fill-opacity="0.25" />

  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="50" y1="20" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="50%" stop-color="#F6BE3C" />
      <stop offset="100%" stop-color="#B28212" />
    </linearGradient>
    
    <!-- Green Gradient -->
    <linearGradient id="greenGradient" x1="50" y1="35" x2="50" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8DA750" />
      <stop offset="100%" stop-color="#3E5219" />
    </linearGradient>
  </defs>
</svg>