<!-- Script for Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerHTML;
                
                // Success visual state
                btn.innerHTML = `
                    <span class="flex items-center justify-center gap-2">
                        Authenticating...
                        <svg class="animate-spin h-5 w-5 text-secondary-fixed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                `;
                btn.classList.add('opacity-80', 'pointer-events-none');

                setTimeout(() => {
                    // Reset or Redirect logic simulation
                    btn.innerHTML = originalText;
                    btn.classList.remove('opacity-80', 'pointer-events-none');
                }, 2000);
            });

            // Smooth parallax effect on the image
            const imageContainer = document.querySelector('[data-alt]');
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
                imageContainer.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
